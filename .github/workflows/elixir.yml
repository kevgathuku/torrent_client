# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1.24.1
      with:
        elixir-version: '1.20' # [Required] Define the Elixir version
        otp-version: '29.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Compile with warnings as errors
      run: mix compile --warnings-as-errors
      env:
        MIX_ENV: test
    # Single suite run: writes cover/lcov.info, uploaded below. The 80%
    # gate lives in the coveralls.io project settings (commit status
    # fails below it); mix.exs keeps the local gate for mix test --cover.
    # A failed test step must not doom the job while the flake retry
    # below can still rescue it; the Fail gate decides red vs green.
    - name: Run tests with coverage
      id: tests
      continue-on-error: true
      run: mix coveralls.lcov
      env:
        MIX_ENV: test
    # Flake retry: timing-sensitive loopback-TCP tests occasionally
    # fail under parallel load (e.g. connection races surfacing a
    # different failure reason). Re-run only the failed tests.
    - name: Re-run failed tests
      id: retry
      if: steps.tests.outcome == 'failure'
      run: |
        for i in 1 2 3; do
          echo "=> Re-running failed tests (attempt $i)"
          mix test --failed && break
        done
      env:
        MIX_ENV: test
    - name: Fail if tests stayed red
      if: steps.tests.outcome == 'failure' && steps.retry.outcome != 'success'
      run: exit 1
    - name: Post coverage to Coveralls
      if: steps.tests.outcome == 'success' || steps.retry.outcome == 'success'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: cover/lcov.info
        format: lcov